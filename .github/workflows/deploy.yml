# Deploys main to GitHub Pages when you run it (Actions → Deploy → Run workflow, or
# `gh workflow run Deploy --ref main`). The build includes the esp-labs firmware checkout.
# Only main may deploy; checks run before the upload.
#
# A successful deploy is then released: tagged vX.Y.Z (the next semver from the Conventional
# Commits since the last tag, tools/deploy/), with grouped release notes.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# One production deploy at a time; a newer run replaces a queued one, a running one finishes.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    outputs:
      url: ${{ steps.pages.outputs.page_url }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo '::error::Only main may be deployed to GitHub Pages.'
          exit 1
      # The whole history and the tags, to find the last release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agharsallah/esp-labs
          path: esp-labs-firmware
          persist-credentials: false
      - name: Place the firmware beside the guide
        run: mv esp-labs-firmware ../esp-labs
      - uses: ./.github/actions/setup
      - name: Plan the release
        id: plan
        run: node tools/deploy/cli.ts plan | tee -a "$GITHUB_OUTPUT"
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Lint
        run: pnpm lint
      - name: Check chip citations
        run: pnpm chip:refs
      - name: Test
        run: pnpm test
      - name: Build
        env:
          FIRMWARE_REQUIRED: "1"
        run: pnpm build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Summarize deployment
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          URL: ${{ steps.pages.outputs.page_url }}
        run: |
          echo "Deployed $URL ($TAG)" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Tag and release
    needs: deploy
    if: needs.deploy.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Write the release notes
        env:
          VERSION: ${{ needs.deploy.outputs.version }}
          URL: ${{ needs.deploy.outputs.url }}
        run: node tools/deploy/cli.ts notes "$VERSION" "$URL" > "$RUNNER_TEMP/notes.md"
      # Creates the tag on the deployed commit and marks this release as the latest.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.deploy.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
          echo "Released $TAG: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
